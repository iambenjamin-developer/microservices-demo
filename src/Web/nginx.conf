server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints the assets it emits, so they can be cached forever; index.html must not be,
    # or a browser would keep loading the previous build's asset names after a deployment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page application: the router owns the paths, so anything that is not a file is index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
